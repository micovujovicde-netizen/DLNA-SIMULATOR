
name: DLNA Simulator - AUTO BUILD

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Find and unpack newest ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find . -maxdepth 3 -type f -iname '*.zip' -not -path './.git/*' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)
          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP found"
            exit 1
          fi
          echo "Unpacking: $ZIP"
          unzip -o "$ZIP" -d .
          test -f settings.gradle || test -f settings.gradle.kts
          test -d app

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DLNA-SIMULATOR-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
