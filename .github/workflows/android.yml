name: DLNA Simulator - AUTO UNPACK + APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto unpack Android source ZIP
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 2 -type f -iname 'TERAPHON_DLNA_SIMULATOR_ANDROID_SOURCE.zip' | head -1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Android source ZIP not found"
            exit 1
          fi

          echo "Unpacking $ZIP"
          unzip -o "$ZIP" -d .

          test -f settings.gradle || exit 1
          test -d app || exit 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DLNA-SIMULATOR-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
