name: Build TERAPHON Receiver Android
on:
  workflow_dispatch:
  push:
    paths:
      - 'TERAPHON_RECEIVER_ANDROID*.zip'
      - '.github/workflows/android.yml'
permissions:
  contents: read
concurrency:
  group: a7-receiver-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK (API 35)
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$sdk_root" || { echo "Android SDK directory not found: $sdk_root"; exit 1; }
          sdkmanager=$(find "$sdk_root/cmdline-tools" -type f -path '*/bin/sdkmanager' -print | sort -V | tail -n 1)
          test -x "$sdkmanager" || { echo "sdkmanager not found in $sdk_root"; exit 1; }
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          # Do not request legacy `tools`: removed from modern SDK repositories.
          set +o pipefail
          yes | "$sdkmanager" --sdk_root="$sdk_root" --licenses >/dev/null
          set -o pipefail
          packages=()
          test -d "$sdk_root/platforms/android-35" || packages+=("platforms;android-35")
          test -d "$sdk_root/build-tools/35.0.0" || packages+=("build-tools;35.0.0")
          test -d "$sdk_root/platform-tools" || packages+=("platform-tools")
          if (( ${#packages[@]} > 0 )); then
            "$sdkmanager" --sdk_root="$sdk_root" --install "${packages[@]}"
          fi
          echo 'Installed Android SDK packages:'
          ls "$sdk_root/platforms" "$sdk_root/build-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack receiver source
        shell: bash
        run: |
          set -euo pipefail
          archive=$(find . -maxdepth 1 -type f -name 'TERAPHON_RECEIVER_ANDROID*.zip' -printf '%f\n' | sort -V | tail -n 1)
          test -n "$archive" || { echo 'Upload TERAPHON_RECEIVER_ANDROID source ZIP at repository root'; exit 1; }
          unzip -tq "$archive"
          mkdir -p "$RUNNER_TEMP/receiver"
          unzip -q "$archive" -d "$RUNNER_TEMP/receiver"
          test -f "$RUNNER_TEMP/receiver/settings.gradle"
      - name: Verify and build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/receiver"
          sh verification/test.sh
          gradle :app:assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/TERAPHON-RECEIVER-ANDROID.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: TERAPHON_RECEIVER_ANDROID_APK
          path: TERAPHON-RECEIVER-ANDROID.apk
          if-no-files-found: error
