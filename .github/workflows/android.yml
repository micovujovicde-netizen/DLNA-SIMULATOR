name: DLNA Simulator - AUTO UNPACK + APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Auto unpack ZIP
        run: |
          if [ ! -f settings.gradle ]; then
            ZIP=$(find . -maxdepth 2 -iname '*.zip' | sort | head -1)
            test -n "$ZIP" || { echo "Upload Android source ZIP first"; exit 1; }
            unzip -o "$ZIP" -d .
          fi
          test -f settings.gradle
          test -d app
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: DLNA-SIMULATOR-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
