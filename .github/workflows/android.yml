
name: DLNA Simulator - AUTO BUILD

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Unpack source
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 2 -type f -iname 'TERAPHON_DLNA_SIMULATOR_ANDROID_SOURCE.zip' | head -1)
          test -n "$ZIP" || exit 1
          unzip -o "$ZIP" -d .
          test -f settings.gradle
          test -d app

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DLNA-SIMULATOR-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  
